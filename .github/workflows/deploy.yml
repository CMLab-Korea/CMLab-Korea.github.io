name: Deploy CMLab website to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage website files
        run: |
          mkdir _site
          cp -r -- *.html assets data robots.txt .nojekyll _site/
      - name: Set up media preview tools
        run: |
          packages=()
          if ! command -v ffmpeg >/dev/null; then
            packages+=(ffmpeg)
          fi
          if ! command -v heif-convert >/dev/null &&
             [[ -n "$(find _site/assets/img/gallery -type f \( -iname '*.heic' -o -iname '*.heif' \) -print -quit)" ]]; then
            packages+=(libheif-examples)
          fi
          if (( ${#packages[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
      - name: Index paper, gallery and profile media
        run: python3 scripts/index_site_media.py --for-deploy --site-dir _site >> "$GITHUB_STEP_SUMMARY"
      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: _site
      - name: Verify artifact registration
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: package
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages

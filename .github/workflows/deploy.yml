name: Deploy CMLab website to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync-catalog:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync publication news and numbered media folders
        id: sync
        shell: bash
        run: |
          python3 scripts/sync_publications.py | tee -a "$GITHUB_STEP_SUMMARY"
          python3 scripts/index_site_media.py --gallery-only
          git add -- data/publications.json data/gallery.json data/media-migration.json assets/media/publications assets/img/gallery
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Sync publication news and numbered media folders"
            git push origin HEAD:main
          fi
          git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"
  package:
    needs: sync-catalog
    if: ${{ !cancelled() && (needs.sync-catalog.result == 'success' || needs.sync-catalog.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-catalog.outputs.sha || github.sha }}
      - name: Stage website files
        run: |
          mkdir _site
          cp -r -- *.html assets data robots.txt .nojekyll _site/
      - name: Set up media preview tools
        run: |
          packages=()
          if ! command -v ffmpeg >/dev/null; then
            packages+=(ffmpeg)
          fi
          if ! command -v heif-convert >/dev/null &&
             [[ -n "$(find _site/assets/img/gallery -type f \( -iname '*.heic' -o -iname '*.heif' \) -print -quit)" ]]; then
            packages+=(libheif-examples)
          fi
          if (( ${#packages[@]} )); then
            sudo apt-get update
            sudo apt-get install -y "${packages[@]}"
          fi
      - name: Index paper, gallery and profile media
        run: python3 scripts/index_site_media.py --for-deploy --site-dir _site
      - id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: _site
      - name: Verify artifact registration
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: test -n "$ARTIFACT_ID"
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: package
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages

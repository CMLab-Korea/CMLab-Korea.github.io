name: Capture CMLab legacy sources

on:
  workflow_dispatch:
  push:
    branches: [codex/cmlab-v1-1-preview]
    paths:
      - .github/workflows/collect-cmlab-sources.yml
      - scripts/collect_cmlab_sources.py

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.58.0
      - name: Capture with Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            python scripts/collect_cmlab_sources.py --chromium "$(command -v google-chrome)" --output capture
          else
            python -m playwright install chromium
            python scripts/collect_cmlab_sources.py --output capture
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cmlab-legacy-sources
          path: capture/
          retention-days: 7
      - name: Store reviewed-source inputs on the capture branch
        if: success() && github.ref == 'refs/heads/codex/cmlab-v1-1-preview'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f capture/*.json
          tree="$(git write-tree)"
          branch=refs/heads/codex/cmlab-source-capture
          previous="$(git ls-remote origin "$branch" | cut -f1)"
          if [ -n "$previous" ]; then
            git fetch --no-tags origin "$branch"
          fi
          commit="$(git commit-tree "$tree" -p "${previous:-HEAD}" -m "Capture public CMLab source records")"
          git push origin "$commit:refs/heads/codex/cmlab-source-capture"

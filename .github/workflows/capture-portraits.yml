name: Verify public collaborator portraits
on:
  push:
    branches: [codex/cmlab-portrait-capture]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright==1.58.0 pillow==12.2.0
      - run: python scripts/capture_profile_candidates.py
      - name: Store public source evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add capture/portraits
          git commit -m 'Capture collaborator homepage portrait candidates'
          git push origin HEAD:refs/heads/codex/cmlab-portrait-capture

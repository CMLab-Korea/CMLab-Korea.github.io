name: Validate journal metrics

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  jcr-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install openpyxl==3.1.5
      - run: python -B scripts/validate_journal_metrics.py
      - run: python -B -m unittest discover -s tests -v
      - run: node --test tests/journal-*.test.cjs
      - name: Verify Pages input boundary
        run: python -B tests/check_journal_pages_boundary.py
